# /etc/apache2/mods-available/evasive.conf  (pacote libapache2-mod-evasive)
# Limita requisições por IP. Ao estourar o limite o IP recebe 403 durante DOSBlockingPeriod.
# O fail2ban (jail plenario-aberto-http-erros) transforma 403 repetidos em bloqueio no firewall.
<IfModule mod_evasive20.c>
    DOSHashTableSize    3097
    # mais de 10 pedidos da MESMA página em 2 s
    DOSPageCount        10
    DOSPageInterval     2
    # mais de 60 pedidos ao site inteiro em 2 s
    DOSSiteCount        60
    DOSSiteInterval     2
    # tempo (s) em que o IP fica bloqueado com 403
    DOSBlockingPeriod   120
    DOSLogDir           "/var/log/mod_evasive"
    DOSEmailNotify      none
    DOSWhitelist        127.0.0.1
</IfModule>
