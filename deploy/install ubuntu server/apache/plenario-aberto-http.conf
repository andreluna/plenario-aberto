# /etc/apache2/sites-available/plenario-aberto-http.conf
# Porta 80: só serve o desafio do Let's Encrypt e redireciona o resto para HTTPS.
<VirtualHost *:80>
    ServerName painel.exemplo.com.br
    DocumentRoot /opt/plenario-aberto/public

    <Directory /opt/plenario-aberto/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://painel.exemplo.com.br/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/plenario-aberto-http-error.log
    CustomLog ${APACHE_LOG_DIR}/plenario-aberto-http-access.log combined
</VirtualHost>
