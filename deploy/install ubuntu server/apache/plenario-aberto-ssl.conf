# /etc/apache2/sites-available/plenario-aberto-ssl.conf
# Porta 443: HTTPS + proxy reverso para o gunicorn em 127.0.0.1:8000.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName painel.exemplo.com.br
    # DocumentRoot separado do código: contém só um index.html vazio.
    DocumentRoot /opt/plenario-aberto/public

    # --- TLS (certificados gerados pelo certbot) ---
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/painel.exemplo.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/painel.exemplo.com.br/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off
    SSLUseStapling        on

    # --- Cabeçalhos de segurança (o Flask já envia CSP, nosniff, frame e referrer) ---
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always unset X-Powered-By
    Header always unset Server

    # --- Limites contra abuso ---
    LimitRequestBody 10240
    LimitRequestFields 50
    LimitRequestFieldSize 4094
    LimitRequestLine 4094
    TimeOut 60
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

    # --- Só GET/HEAD: a aplicação é somente leitura ---
    <Location />
        <LimitExcept GET HEAD>
            Require all denied
        </LimitExcept>
    </Location>

    # --- Nunca expor arquivos ocultos, de código ou de ambiente ---
    <DirectoryMatch "/\.(git|venv|well-known/(?!acme-challenge))">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(py|pyc|env|ini|log|bak|zip|md|service|conf)$">
        Require all denied
    </FilesMatch>

    <Directory /opt/plenario-aberto/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Proxy reverso (não funciona como proxy aberto) ---
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /.well-known/ !
    ProxyPass        / http://127.0.0.1:8000/ timeout=180
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/plenario-aberto-error.log
    CustomLog ${APACHE_LOG_DIR}/plenario-aberto-access.log combined
</VirtualHost>
</IfModule>

# Cole em /etc/apache2/conf-available/seguranca.conf e ative com: a2enconf seguranca
#   ServerTokens Prod
#   ServerSignature Off
#   TraceEnable Off
#   SSLStaplingCache shmcb:/var/run/apache2/stapling_cache(128000)
